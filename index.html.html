function volunteer(){return ph('義工服務照片')+section('義工服務介紹',lines(4))+section('義工組別','<div class="grid">'+['一般義工','引領員','組長'].map(t=>'<div class="card"><h3>'+t+'</h3>'+lines(2)+'</div>').join('')+'</div>')+section('義工簡介會、訓練及申請說明',lines(4)+signup('親切義工','義工報名'))}
function donation(){return section('捐款用途介紹',lines(4))+'<div class="grid two"><section class="card"><h3>單次捐款</h3>'+lines(2)+'<div class="spec"><div>金額選擇</div><div>自訂金額</div></div><div class="notice">付款介面占位，不進行交易</div></section><section class="card"><h3>月捐計劃</h3>'+lines(3)+'<div class="notice">定期捐款介面占位，不進行交易</div></section></div>'+section('其他捐款方式','<div class="grid">'+['轉數快','PayMe','支付寶香港','7-Eleven便利店','支票／直接存款'].map(t=>'<div class="card"><h3>'+t+'</h3>'+ph('付款資訊占位')+'</div>').join('')+'</div>')+section('捐款常見問題',N['p10'].children.length?['捐款收據與稅項','更改捐款資料','經費運用及財政資料'].map(t=>'<details class="more"><summary>'+t+'</summary>'+lines(3)+'</details>').join(''):'')}
function documents(){return N['p7'].children.map(k=>{let n=N[k];return section(n.title,n.children.map(c=>{let v=N[c];if(v.page)return card(c);if(v.children.some(z=>N[z].page))return '<div class="section"><h3>'+esc(v.title)+'</h3><div class="grid two">'+v.children.map(z=>card(z)).join('')+'</div></div>';return '<div class="listrow"><h3>'+esc(v.title)+'</h3><span class="tag">文件列表／PDF</span></div>'}).join(''))}).join('')}
function render(){let id=location.hash.slice(1)||'p0';if(!P.includes(id))id=route(id);current=id;let n=N[id];document.title=n.title+'｜TREATS 低保真原型';$('#bread').innerHTML=link('p0','首頁')+(id==='p0'?'':'<span>/</span><span>'+esc(n.title)+'</span>')+'<span class="chip">'+id+'</span>';let body='';if(id==='p0')body=home();else{let intro='<div class="intro"><span class="page-id">'+id+'</span><h1>'+esc(n.title)+'</h1></div>';if(id==='p9')body=contact();else if(id==='p5-2')body=volunteer();else if(id==='p10')body=donation();else if(id==='p7')body=documents();else if(id==='p4')body=n.children.map(groupSection).join('');else if(id.startsWith('p4-'))body=service(id);else if(id==='p3-1')body=latest();else if(id==='p3-2')body=section('按年月排列的活動回顧', ['2026年10月','2026年9月','2026年8月','較早活動'].map(m=>'<details class="more"><summary>'+m+'</summary><div class="inner">'+ph('活動照片')+lines(4)+'</div></details>').join(''));else if(n.children.length)body=n.children.map(groupSection).join('');else body=ph('頁面主題圖片／文件位置')+lines(4)+lines(4);body=intro+body;}$('#content').innerHTML=body;document.querySelectorAll('#nav details').forEach(x=>x.open=false);document.querySelectorAll('[data-demo]').forEach(f=>f.addEventListener('submit',e=>{e.preventDefault();f.querySelector('.result').innerHTML='<div class="submitresult">已顯示提交後介面示意。這是低保真模型，沒有傳送、儲存或建立任何申請。</div>'}));document.querySelectorAll('[data-activity]').forEach(b=>b.addEventListener('click',()=>openApplication(b.dataset.activity)));$('#catalog').removeAttribute('open');renderList();window.scrollTo(0,0)}
function renderList(){let term=$('#pageSearch').value.trim().toLowerCase();$('#pageList').innerHTML=P.filter(k=>(k+' '+N[k].title).toLowerCase().includes(term)).map(k=>'<a class="'+(k===current?'current':'')+'" href="#'+k+'"><span class="chip">'+k+'</span>'+esc(N[k].title)+'</a>').join('');$('#count').textContent=P.length}
function openApplication(activity){$('#applicationForm').reset();$('#applicationActivity').value=activity;$('#applicationResult').textContent='';$('#applicationDialog').showModal()}
$('#closeApplication').onclick=()=>$('#applicationDialog').close();$('#applicationForm').addEventListener('submit',e=>{e.preventDefault();$('#applicationResult').innerHTML='<div class="submitresult">已完成測試；沒有送出報名資料。</div>'});
$('#catalogToggle').onclick=()=>{$('#catalog').setAttribute('open','');$('#pageSearch').focus()};$('#closeCatalog').onclick=()=>$('#catalog').removeAttribute('open');$('#catalog').onclick=e=>{if(e.target.id==='catalog')$('#catalog').removeAttribute('open')};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#catalog').removeAttribute('open')});$('#pageSearch').oninput=renderList;document.querySelectorAll('#nav details').forEach(el=>el.addEventListener('toggle',()=>{if(el.open)document.querySelectorAll('#nav details').forEach(o=>{if(o!==el)o.open=false})}));window.addEventListener('hashchange',render);render();
</script></body></html>
