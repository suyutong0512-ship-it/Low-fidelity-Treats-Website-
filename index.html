// Current language
let lang='zh';
let DATA=DATA_ZH;
let N=DATA.nodes, P=DATA.pages;
let current='p0';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tt(key){return T[lang][key];}
function lines(n=3){return '<div class="skeleton" aria-label="'+esc(tt('skeletonLabel'))+'">'+Array.from({length:n},()=>'<i></i>').join('')+'</div>';}
function ph(t=''){return '<div class="ph" role="img" aria-label="'+esc(t)+'"></div>';}
function route(id){if(N[id]?.page)return id;if(id==='p2')return 'p2-1';if(id==='p3')return 'p3-1';if(id==='p5')return 'p5-2';if(id==='p6')return 'p6-1';let up=id;while(up.includes('-')){up=up.slice(0,up.lastIndexOf('-'));if(N[up]?.page)return up;}return N[id]?.children.map(route).find(Boolean)||'p0'}
function link(id,txt,cls=''){return '<a class="'+cls+'" href="#'+route(id)+'">'+esc(txt||N[id]?.title||id)+'</a>'}
function branch(id,depth=0){let n=N[id];return link(id,n.title,depth?'sub':'group')+(depth<2?n.children.map(c=>branch(c,depth+1)).join(''):'')}
function buildNav(){$('#nav').innerHTML=DATA.nav.map(n=>'<details><summary>'+esc(n.label)+'</summary><div class="drop">'+(n.children.length?n.children.map(k=>branch(k)).join(''):link(n.id,tt('enter')+n.label))+'</div></details>').join('');document.querySelectorAll('#nav details').forEach(el=>el.addEventListener('toggle',()=>{if(el.open)document.querySelectorAll('#nav details').forEach(o=>{if(o!==el)o.open=false})}));}
function card(id,img=false){let n=N[id];return '<a class="card" href="#'+route(id)+'"><span class="page-id">'+id+'</span>'+(img?ph(): '')+'<h3>'+esc(n.title)+'</h3>'+lines(2)+'<span class="arrow">→</span></a>'}
function section(title,body){return '<section class="section"><div class="sectionhead"><h2>'+esc(title)+'</h2></div>'+body+'</section>'}
function fieldspec(){let f=tt('fieldspec');return '<div class="spec"><div><b>'+esc(f[0])+'</b></div><div><b>'+esc(f[1])+'</b></div><div><b>'+esc(f[2])+'</b></div><div><b>'+esc(f[3])+'</b></div></div>'}
function home(){let roles=tt('homeRoles');return '<div class="page-id">'+esc(tt('homePageId'))+'</div><section class="hero"><div class="words"><span class="tag">'+esc(tt('homeTag'))+'</span><h1>'+tt('homeH1')+'</h1><p class="en">'+esc(tt('homeEn'))+'</p></div>'+ph(tt('homeHeroPh'))+'</section><div class="gallery">'+ph(tt('homePhoto1'))+ph(tt('homePhoto2'))+ph(tt('homePhoto3'))+'</div><p class="bodycopy">'+esc(tt('homeBodycopy'))+'</p>'+section(tt('homeSection'),'<div class="grid">'+roles.map(function(r,i){return '<a class="card" href="#'+r[1]+'"><span class="page-id">'+esc(tt('homeEntry'))+' 0'+(i+1)+'</span><h3>'+esc(r[0])+'</h3>'+lines(2)+'<span class="arrow">→</span></a>'}).join('')+'</div>')+'<section class="section"><div class="sectionhead"><h2>'+esc(tt('homeLatest'))+'</h2>'+link('p3-1',tt('homeViewAll'))+'</div>'+tt('homeLatestItems').map(function(t){return '<div class="listrow"><h3>'+esc(t)+'</h3><span class="tag">'+esc(tt('homeTagOriginal'))+'</span></div>'}).join('')+'</section><p class="caption">'+esc(tt('homeCaption'))+'</p>'}
function groupSection(id){let n=N[id];let pages=n.children.filter(c=>N[c].page);if(pages.length===n.children.length&&pages.length)return section(n.title,'<div class="grid two">'+pages.map(c=>card(c)).join('')+'</div>');return section(n.title,lines()+n.children.map(c=>{let v=N[c];if(v.page)return card(c);return '<details class="more"><summary>'+esc(v.title)+'</summary><div class="inner">'+lines()+(v.children.length?'<ul>'+v.children.map(z=>'<li>'+esc(N[z].title)+'</li>').join('')+'</ul>':'')+'</div></details>'}).join(''))}
function signup(title,label){if(!label)label=tt('signupLabel');return '<div class="signup-row"><button class="signup" data-activity="'+esc(title)+'">'+esc(label)+' →</button></div>'}
function activityBlock(title){return section(title,ph(title)+lines()+fieldspec()+'<details class="more"><summary>'+esc(tt('moreInfo'))+'</summary><div class="inner">'+lines(4)+'</div></details><div class="quote">'+lines(2)+'</div>'+signup(title))}
function service(id){let n=N[id];let activities=n.children.map(k=>N[k].title);if(id==='p4-1-1'){let sep=tt('docSplitSep'),sep2=tt('docSplitSep2'),jsep=tt('docJoinSep');activities=activities.flatMap(function(t){let bits=t.split(sep);if(bits.length===2){return bits[1].split(sep2).map(function(a){return bits[0]+jsep+a.trim()})}return [t]});}return ph()+lines()+activities.map(activityBlock).join('')}
function latest(){let groups=tt('latestGroups');return groups.map(function(g){return section(g[0],'<div class="grid two">'+g[1].map(function(t){return '<article class="card">'+ph()+'<h3>'+esc(t)+'</h3>'+lines(2)+signup(t)+'</article>'}).join('')+'</div>')}).join('')+section(tt('latestScholarship'),'<div class="grid">'+card('p6-1-1')+card('p6-1-2')+card('p5-2')+'</div>')}
function contact(){return '<div class="grid two"><section><h2>'+esc(tt('contactTitle'))+'</h2><form class="fields" data-demo><div class="field"><label for="contact-name">'+esc(tt('contactName'))+'</label><input id="contact-name" required placeholder="'+esc(tt('contactNamePh'))+'"></div><div class="field"><label for="contact-email">'+esc(tt('contactEmail'))+'</label><input id="contact-email" type="email" required placeholder="demo@example.com"></div><div class="field"><label for="contact-phone">'+esc(tt('contactPhone'))+'</label><input id="contact-phone" type="tel"></div><div class="field"><label for="message">'+esc(tt('contactMsg'))+'</label><textarea id="message" required></textarea></div><p class="caption">'+esc(tt('contactCaption'))+'</p><button type="submit">'+esc(tt('contactSubmit'))+'</button><div class="result" role="status"></div></form></section><section><h2>'+esc(tt('contactAddrTitle'))+'</h2>'+ph(tt('contactMap'))+'<p>'+tt('contactAddr')+'</p><h3>'+esc(tt('contactOther'))+'</h3><p>'+esc(tt('contactTel'))+'<br>'+esc(tt('contactMail'))+'<br>'+esc(tt('contactMonthly'))+'<br>'+esc(tt('contactFax'))+'</p></section></div>'}
function volunteer(){return ph(tt('volPhoto'))+section(tt('volIntro'),lines(4))+section(tt('volCats'),'<div class="grid">'+tt('volCatItems').map(function(t){return '<div class="card"><h3>'+esc(t)+'</h3>'+lines(2)+'</div>'}).join('')+'</div>')+section(tt('volApply'),lines(4)+signup(tt('signupActivity'),tt('signupVolunteer')))}
function donation(){return section(tt('donationIntro'),lines(4))+'<div class="grid two"><section class="card"><h3>'+esc(tt('donationOne'))+'</h3>'+lines(2)+'<div class="spec"><div>'+esc(tt('donationAmount'))+'</div><div>'+esc(tt('donationCustom'))+'</div></div><div class="notice">'+esc(tt('donationNotice1'))+'</div></section><section class="card"><h3>'+esc(tt('donationMonthly'))+'</h3>'+lines(3)+'<div class="notice">'+esc(tt('donationNotice2'))+'</div></section></div>'+section(tt('donationOther'),'<div class="grid">'+tt('donationMethods').map(function(t){return '<div class="card"><h3>'+esc(t)+'</h3>'+ph(tt('donationPayPh'))+'</div>'}).join('')+'</div>')+section(tt('donationFaq'),N['p10'].children.length?tt('donationFaqItems').map(function(t){return '<details class="more"><summary>'+esc(t)+'</summary>'+lines(3)+'</details>'}).join(''):'')}
function documents(){return N['p7'].children.map(function(k){let n=N[k];return section(n.title,n.children.map(function(c){let v=N[c];if(v.page)return card(c);if(v.children.some(function(z){return N[z].page}))return '<div class="section"><h3>'+esc(v.title)+'</h3><div class="grid two">'+v.children.map(z=>card(z)).join('')+'</div></div>';return '<div class="listrow"><h3>'+esc(v.title)+'</h3><span class="tag">'+esc(tt('docListLabel'))+'</span></div>'}).join(''))}).join('')}
function render(){let id=location.hash.slice(1)||'p0';if(!P.includes(id))id=route(id);current=id;let n=N[id];document.title=n.title+'| TREATS '+tt('titleSuffix');$('#bread').innerHTML=link('p0',tt('pageIdHome'))+(id==='p0'?'':'<span>/</span><span>'+esc(n.title)+'</span>')+'<span class="chip">'+id+'</span>';let body='';if(id==='p0')body=home();else{let intro='<div class="intro"><span class="page-id">'+id+'</span><h1>'+esc(n.title)+'</h1></div>';if(id==='p9')body=contact();else if(id==='p5-2')body=volunteer();else if(id==='p10')body=donation();else if(id==='p7')body=documents();else if(id==='p4')body=n.children.map(groupSection).join('');else if(id.startsWith('p4-'))body=service(id);else if(id==='p3-1')body=latest();else if(id==='p3-2')body=section(tt('archiveTitle'),tt('archiveItems').map(function(m){return '<details class="more"><summary>'+esc(m)+'</summary><div class="inner">'+ph(tt('archivePhoto'))+lines(4)+'</div></details>'}).join(''));else if(n.children.length)body=n.children.map(groupSection).join('');else body=ph(tt('defaultImg'))+lines(4)+lines(4);body=intro+body;}$('#content').innerHTML=body;document.querySelectorAll('#nav details').forEach(x=>x.open=false);document.querySelectorAll('[data-demo]').forEach(function(f){f.addEventListener('submit',function(e){e.preventDefault();f.querySelector('.result').innerHTML='<div class="submitresult">'+esc(tt('contactResult'))+'</div>'})});document.querySelectorAll('[data-activity]').forEach(function(b){b.addEventListener('click',function(){openApplication(b.dataset.activity)})});$('#catalog').removeAttribute('open');renderList();window.scrollTo(0,0)}
function renderList(){let term=$('#pageSearch').value.trim().toLowerCase();$('#pageList').innerHTML=P.filter(function(k){return (k+' '+N[k].title).toLowerCase().includes(term)}).map(function(k){return '<a class="'+(k===current?'current':'')+'" href="#'+k+'"><span class="chip">'+k+'</span>'+esc(N[k].title)+'</a>'}).join('');$('#count').textContent=P.length}
function openApplication(activity){$('#applicationForm').reset();$('#applicationActivity').value=activity;$('#applicationResult').textContent='';$('#applicationDialog').showModal()}
function updateStaticText(){$('#catalogToggle').innerHTML=esc(tt('catalogToggle'))+' <span id="count"></span>';$('#catalogTitle').textContent=tt('catalogTitle');$('#closeCatalog').textContent=tt('closeCatalog');$('#closeCatalog').setAttribute('aria-label',tt('closeCatalog'));$('#catalogHelp').textContent=tt('catalogHelp');$('#pageSearch').setAttribute('placeholder',tt('searchPlaceholder'));$('#pageSearch').setAttribute('aria-label',tt('searchPlaceholder'));$('#socialMedia').textContent=tt('socialMedia');$('#logoSub').textContent=tt('logoSub');$('#footerMember').textContent=tt('footerMember');$('#footerContact').textContent=tt('footerContact');$('#footerPhone').textContent=tt('footerPhone');$('#footerEmail').textContent=tt('footerEmail');$('#footerAddr').textContent=tt('footerAddr');$('#footerTerms').textContent=tt('footerTerms');$('#footerPrivacy').textContent=tt('footerPrivacy');$('#applicationTitle').textContent=tt('appTitle');$('#lblActivity').textContent=tt('lblActivity');$('#lblName').textContent=tt('lblName');$('#lblEmail').textContent=tt('lblEmail');$('#lblGroup').textContent=tt('lblGroup');$('#lblNote').textContent=tt('lblNote');$('#appCaption').textContent=tt('appCaption');$('#appSubmit').textContent=tt('appSubmit');$('#nav').setAttribute('aria-label',tt('navLabel'));}
function setLang(newLang){lang=newLang;DATA=(lang==='en')?DATA_EN:DATA_ZH;N=DATA.nodes;P=DATA.pages;document.documentElement.lang=(lang==='en')?'en':'zh-Hant';$('#langZh').className=(lang==='zh')?'active':'';$('#langEn').className=(lang==='en')?'active':'';updateStaticText();buildNav();render();}
$('#closeApplication').onclick=function(){$('#applicationDialog').close()};
$('#applicationForm').addEventListener('submit',function(e){e.preventDefault();$('#applicationResult').innerHTML='<div class="submitresult">'+esc(tt('appResult'))+'</div>'});
$('#catalogToggle').onclick=function(){$('#catalog').setAttribute('open','');$('#pageSearch').focus()};
$('#closeCatalog').onclick=function(){$('#catalog').removeAttribute('open')};
$('#catalog').onclick=function(e){if(e.target.id==='catalog')$('#catalog').removeAttribute('open')};
document.addEventListener('keydown',function(e){if(e.key==='Escape')$('#catalog').removeAttribute('open')});
$('#pageSearch').oninput=renderList;
$('#langZh').onclick=function(){setLang('zh')};
$('#langEn').onclick=function(){setLang('en')};
window.addEventListener('hashchange',render);
buildNav();
render();
</script></body></html>
